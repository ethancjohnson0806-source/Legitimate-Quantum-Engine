[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legitimate-quantum-engine"
version = "5.0.0"
description = "A pure-NumPy quantum computing framework that runs on your phone"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
jit = ["numba>=0.56"]

[project.scripts]
lqe-shell = "shell:main"
lqe-dashboard = "dashboard:main"

[project.urls]
Homepage = "https://github.com/yourusername/legitimate-quantum-engine"
Repository = "https://github.com/yourusername/legitimate-quantum-engine"
Issues = "https://github.com/yourusername/legitimate-quantum-engine/issues"
